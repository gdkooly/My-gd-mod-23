name: Build Geode Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@master

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Geode CLI Manually
        run: |
          # Fetch and install the latest stable Linux Geode CLI directly from official releases
          curl -sSLo geode-cli.zip https://github.com
          unzip geode-cli.zip
          chmod +x geode
          sudo mv geode /usr/local/bin/
          geode --version

      - name: Build Mod with CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DGEODE_TARGET=Android
          cmake --build . --config Release
